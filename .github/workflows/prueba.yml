
name: Prueba automatica DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar prueba automatica
        run: |
          python -c "assert 2 + 2 == 4, 'La prueba fallo'"
          echo "Prueba automatica completada correctamente"
